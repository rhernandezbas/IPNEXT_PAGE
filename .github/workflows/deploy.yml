name: Deploy IPNEXT Landing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker
        run: |
          docker build -t ipnext-landing:latest -t ipnext-landing:${{ github.sha }} .

      - name: Detener contenedor anterior (si existe)
        run: |
          docker stop ipnext-landing || true
          docker rm   ipnext-landing || true

      - name: Ejecutar nuevo contenedor
        run: |
          docker run -d \
            --name ipnext-landing \
            --restart unless-stopped \
            -p 7777:7777 \
            ipnext-landing:latest

      - name: Verificar que el contenedor está corriendo
        run: |
          sleep 5
          docker ps | grep ipnext-landing

      - name: Limpiar imágenes viejas
        run: |
          docker image prune -f
