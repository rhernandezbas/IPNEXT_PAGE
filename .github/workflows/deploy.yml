name: Deploy IPNEXT Landing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker
        run: |
          docker build -t ipnext-landing:latest -t ipnext-landing:${{ github.sha }} .

      - name: Detener contenedor anterior (si existe)
        run: |
          docker stop ipnext-landing || true
          docker rm   ipnext-landing || true

      - name: Ejecutar nuevo contenedor
        run: |
          docker run -d \
            --name ipnext-landing \
            --restart unless-stopped \
            --network easypanel \
            -p 7777:7777 \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.ipnext-http.rule=Host(\`ipnext.com.ar\`) || Host(\`www.ipnext.com.ar\`) || Host(\`web.ipnext.com.ar\`) || Host(\`ipnext.net.ar\`) || Host(\`www.ipnext.net.ar\`)" \
            --label "traefik.http.routers.ipnext-http.entrypoints=http" \
            --label "traefik.http.routers.ipnext-http.middlewares=redirect-to-https" \
            --label "traefik.http.routers.ipnext-https.rule=Host(\`ipnext.com.ar\`) || Host(\`www.ipnext.com.ar\`) || Host(\`web.ipnext.com.ar\`) || Host(\`ipnext.net.ar\`) || Host(\`www.ipnext.net.ar\`)" \
            --label "traefik.http.routers.ipnext-https.entrypoints=https" \
            --label "traefik.http.routers.ipnext-https.tls.certresolver=letsencrypt" \
            --label "traefik.http.services.ipnext-landing.loadbalancer.server.port=7777" \
            ipnext-landing:latest

      - name: Verificar que el contenedor está corriendo
        run: |
          sleep 5
          docker ps | grep ipnext-landing

      - name: Limpiar imágenes viejas
        run: |
          docker image prune -f
